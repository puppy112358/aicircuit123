model_config:
  - model: TransformerV2
    dim_model: 192
    num_heads: 6
    num_encoder_layers: 4
    dim_hidden: 384
    dropout_p: 0.1
    extra_args:
      learning_rate: 0.0008
      optimizer: adamw
      weight_decay: 0.0001
      batch_size: 128
      use_smooth_l1: True
      smooth_l1_beta: 0.3
      use_scheduler: True
      scheduler: onecycle
      max_learning_rate: 0.0025
      onecycle_pct_start: 0.2
      onecycle_div_factor: 15.0
      onecycle_final_div_factor: 150.0
      clip_grad: True
      clip_grad_norm: 1.0
      use_early_stop: True
      early_stop_patience: 10
      early_stop_min_delta: 1.0e-5
      use_amp: True
      adamw_param_groups: True
  - model: MultiLayerPerceptronV2
    extra_args:
      learning_rate: 0.003
      max_learning_rate: 0.006
      optimizer: adamw
      weight_decay: 0.0001
      use_scheduler: True
      scheduler: onecycle
      onecycle_pct_start: 0.15
      onecycle_div_factor: 10.0
      onecycle_final_div_factor: 100.0
      use_early_stop: True
      early_stop_patience: 12
      early_stop_min_delta: 0.0001
      use_smooth_l1: True
      smooth_l1_beta: 0.5
      clip_grad: True
      clip_grad_norm: 1.0
      batch_size: 128
  # - model: Transformer
  # - model: RandomForest
  # - model: SupportVector
  # - model: KNeighbors

device: cpu
log_experiments: False
epochs: 100
subset:
  - 0.9
circuits:
  - CSVA
  - CVA
  - TSVA
  - LNA
  - Mixer
  - VCO
  - PA
  - Transmitter
  - Receiver
compare_method: True
kfold: False
independent_kfold: True
save_format: csv
save_model: True

